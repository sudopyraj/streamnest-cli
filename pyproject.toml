[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "streamnest-cli"
version = "1.0.0"
description = "A polished interactive terminal media downloader for YouTube and Instagram."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Prince Raj" }]
keywords = ["youtube", "instagram", "downloader", "cli", "yt-dlp", "media"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Video",
]
dependencies = [
    "Flask>=3.0",
    "yt-dlp>=2024.4.9",
    "rich>=13.7",
    "typer>=0.12",
    "questionary>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
media-dl = "media_downloader.cli:app"
streamnest = "media_downloader.cli:app"

[project.urls]
Homepage = "https://github.com/sudopyraj/streamnest-cli"
Repository = "https://github.com/sudopyraj/streamnest-cli"
Issues = "https://github.com/sudopyraj/streamnest-cli/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.vercel]
entrypoint = "main:app"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
